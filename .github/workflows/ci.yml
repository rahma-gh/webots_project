name: CI Pipeline - Architecture 1

on:
  push:
    branches: [develop]

jobs:
  tests-complets:
    name: "Tests Complets — Architecture Classique"
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 2

      - name: "Absence d'adaptation — Analyse des changements"
        run: |
          echo "=============================================="
          echo "  ARCHITECTURE CLASSIQUE — SANS IA"
          echo "=============================================="
          echo ""
          echo "📂 FICHIERS MODIFIÉS DANS CE PUSH :"
          git diff --name-only HEAD~1 HEAD || echo "(premier commit)"
          echo ""
          CHANGED=$(git diff --name-only HEAD~1 HEAD | wc -l)
          echo "----------------------------------------------"
          echo "  Nombre de fichiers modifiés : $CHANGED"
          echo "----------------------------------------------"
          echo ""
          echo "⚠️  ABSENCE D'ADAPTATION :"
          echo "  Peu importe le nombre de fichiers modifiés,"
          echo "  TOUS les tests seront exécutés sans sélection."
          echo ""
          echo "  → TOTAL : 85 tests exécutés systématiquement"
          echo "=============================================="

      - name: Build image Docker
        run: docker build -t pfe-simulation .

      - name: Lancer tous les tests dans Docker
        run: |
          docker run \
            --name pfe-test \
            pfe-simulation

      - name: Récupérer les rapports
        if: always()
        run: |
          docker cp pfe-test:/app/reports/. reports/

      - name: Upload rapport
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rapport-tests
          path: reports/