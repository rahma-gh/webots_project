name: CI Pipeline - Architecture 1

on:
  push:
    branches: [develop]

jobs:
  tests-statiques:
    name: " Tests Statiques"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 2

      - name: Installer Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Installer les dépendances
        run: pip install pytest pytest-html

      - name: Lancer les tests statiques
        run: |
           pytest tests/communication/ \
           tests/functional/ \
           tests/realtime/ \
           tests/safety/ \
           -v --html=reports/report_statique.html || true

      - name: Upload rapport statique
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rapport-tests-statiques
          path: reports/report_statique.html

  tests-comportementaux:
    name: " Tests Comportementaux Docker+Webots"
    runs-on: ubuntu-22.04
    needs: tests-statiques

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 2

      - name: Build image Docker
        run: docker build -t pfe-simulation .

      - name: Lancer les tests dans Docker
        run: |
          docker run \
            --name pfe-test \
            pfe-simulation

      - name: Récupérer les rapports
        if: always()
        run: |
          docker cp pfe-test:/app/reports/. reports/

      - name: Upload rapport comportemental
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rapport-tests-comportementaux
          path: reports/